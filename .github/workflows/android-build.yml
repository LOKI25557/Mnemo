name: Android CI Build & Verification

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Validate Offline Security (No INTERNET Permission)
        run: |
          echo "Auditing AndroidManifest for prohibited INTERNET permission..."
          if grep -rn "android.permission.INTERNET" app/src/main/AndroidManifest.xml; then
            echo "SECURITY VIOLATION: android.permission.INTERNET found in AndroidManifest.xml!"
            exit 1
          fi
          echo "Audit passed: Zero network permissions requested."

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mnemo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
